[project]
name = "cal-bookings-backend"
version = "0.1.0"
description = "Calendar Bookings API backend: FastAPI implementation of the main.tsp contract"
requires-python = ">=3.14"
dependencies = [
  "email-validator>=2.2",
  "fastapi>=0.115",
  "pydantic>=2.10",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "schemathesis>=3.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cal_bookings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
