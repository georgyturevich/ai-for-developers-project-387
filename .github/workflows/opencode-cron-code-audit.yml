name: OpenCode Code Audit
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for OpenCode"
        required: false
        type: string
      model:
        description: "Model to use"
        required: false
        type: string
  schedule:
    - cron: "17 * * * *" 
jobs:
  opencode-review:
    runs-on: ubuntu-latest
    env:
      DEFAULT_MODEL: "opencode/big-pickle"
      DEFAULT_PROMPT: "Review the codebase for TODO, FIXME, and HACK comments. Group them by priority and create an issue with a summary."
    permissions:
      id-token: write # Нужен для аутентификации через GitHub Actions
      contents: read # Достаточно для чтения кода и diff
      pull-requests: read # Достаточно для чтения данных PR
      issues: write # Нужно, чтобы оставлять комментарии в PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run OpenCode audit
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ inputs.model || env.DEFAULT_MODEL }}
          prompt: ${{ inputs.prompt || env.DEFAULT_PROMPT }}
